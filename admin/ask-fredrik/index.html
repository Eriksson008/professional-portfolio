<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ask Fredrik — Admin</title>
    <!-- Private admin panel: keep it out of search indexes entirely. In
         production this page is served by the Ask-Fredrik Worker itself
         (npm run build:admin) behind Cloudflare Access, and the Worker
         re-validates the Access identity on every API call. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="%BASE_URL%admin-icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%admin-icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%admin-icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%admin-icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%admin.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ask Fredrik" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="%BASE_URL%admin-icons/icon-144.png" />

    <!--
      Share card, for when this dashboard's URL is sent in a message.

      The origin is written out rather than using %BASE_URL%: that resolves to
      "/" for this build, and an unfurler holds only the tag's string value, so
      a root-relative path is fetched against the wrong host. og:image has to be
      absolute or it is not an image.

      `noindex, nofollow` above stays, and does not conflict. It is a directive
      to search indexers; the unfurlers that read these tags — iMessage, Slack,
      WhatsApp — do not consult it. This page should stay out of Google and
      still look like something when it is sent to a phone.

      NOTE: no preview is produced today. Cloudflare Access gates /admin at the
      edge, so an unfurler is served the login page instead of this file and
      never reads these tags. See cloudflare/ask-fredrik-worker/README.md
      ("Link previews") for what that would take and why it has not been done.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ask Fredrik" />
    <meta property="og:url" content="https://ask-fredrik.eriksson-fredrik08.workers.dev/admin/ask-fredrik/" />
    <meta property="og:title" content="Ask Fredrik — Admin" />
    <meta
      property="og:description"
      content="Private dashboard for the Ask Fredrik assistant — question log, usage stats, and export."
    />
    <meta
      property="og:image"
      content="https://ask-fredrik.eriksson-fredrik08.workers.dev/og-ask-fredrik.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An astronaut holding a helmet, lit against a dark mission-control wall of telemetry screens"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ask Fredrik — Admin" />
    <meta
      name="twitter:image"
      content="https://ask-fredrik.eriksson-fredrik08.workers.dev/og-ask-fredrik.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
