<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values: the
         phone dock sits in the home-indicator area and .wrap pads for the
         landscape cutout. -->

    <title>Fredrik Eriksson — Senior Software Engineer</title>
    <meta
      name="description"
      content="Fredrik Eriksson — Senior Software Engineer with acting Technical Lead experience. Enterprise Salesforce platforms, Java/Spring Boot services, React/TypeScript on AWS, Docker, CI/CD, and AI-assisted delivery."
    />
    <meta name="author" content="Fredrik Eriksson" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://eriksson008.github.io/professional-portfolio/" />

    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="%BASE_URL%icon-144.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fredrik Eriksson — Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://eriksson008.github.io/professional-portfolio/" />

    <meta
      property="og:description"
      content="Senior full-stack engineer with acting Technical Lead experience — enterprise Salesforce, Java/Spring, React/TypeScript, AWS, and AI-assisted delivery."
    />

         URL, so a new image at the old path keeps serving the stale card. Bump to -v3 etc.
         whenever the artwork changes. -->
    <meta property="og:image" content="https://eriksson008.github.io/professional-portfolio/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fredrik Eriksson in an astronaut suit, helmet held at one side, lit against a black background" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fredrik Eriksson — Senior Software Engineer" />

      name="twitter:description"
      content="Senior full-stack engineer with acting Technical Lead experience — enterprise Salesforce, Java/Spring, React/TypeScript, AWS, and AI-assisted delivery."
