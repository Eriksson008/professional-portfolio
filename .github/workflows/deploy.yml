name: Deploy to GitHub Pages

# Builds the Vite site and publishes dist/ to GitHub Pages on every push to main.
# Requires (one-time, in repo Settings → Pages): Source = "GitHub Actions".
# The repo must be public, or on a plan that allows Pages for private repos.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read the repo, write Pages, mint the deploy id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The hero's derived media (97-frame WebP sequence + the optimized
      # all-intra desktop encode) is regenerated here rather than committed.
      # ~17 MB of binaries in a public repo would be permanent — a force-push
      # does not un-publish — and everything is reproducible from media-src/,
      # which is tracked. Skipping this would deploy a site where ?hero=frames-97
      # 404s and silently falls back to the poster.
      # Parameters are fixed in the script and were chosen by measurement:
      # docs/cinematic-hero-benchmark-2.md.
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Generate hero media
        run: node scripts/generate-hero-media.mjs

      # Fail loudly rather than shipping a hero whose frames are missing.
      - name: Verify hero media
        run: node scripts/generate-hero-media.mjs --check

      # Project site lives under /professional-portfolio/, so build with that base.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /professional-portfolio/
          # Optional Ask Fredrik backend (cloudflare/ask-fredrik-worker): set the
          # repo Actions *variable* VITE_ASK_FREDRIK_API_URL to the Worker's /ask
          # URL to enable it; unset/empty keeps the free static answers.
          VITE_ASK_FREDRIK_API_URL: ${{ vars.VITE_ASK_FREDRIK_API_URL }}
          # The private Ask-Fredrik admin dashboard is NOT part of this Pages
          # build: it deploys with the Worker (npm run build:admin + wrangler
          # deploy) behind Cloudflare Access. See docs/ask-fredrik-dashboard.md.

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
